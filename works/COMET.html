<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COMET Algorithm Interactive Demo</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
const { useState, useMemo } = React;

// Gaussian kernel function
const gaussianKernel = (x, xi, bandwidth) => {
  const u = (x - xi) / bandwidth;
  return Math.exp(-0.5 * u * u) / (bandwidth * Math.sqrt(2 * Math.PI));
};

// Calculate true VAF (simulated ground truth)
const calculateTrueVAF = (vafPercent) => {
  return vafPercent; // The slider directly represents VAF
};

// Calculate KDE for a set of data points
const calculateKDE = (data, bandwidth = 0.05, numPoints = 100, normalize = true) => {
  const min = 0;
  const max = 1;
  const step = (max - min) / numPoints;
  const kdePoints = [];

  for (let i = 0; i <= numPoints; i++) {
    const x = min + i * step;
    let density = 0;

    for (const value of data) {
      density += gaussianKernel(x, value, bandwidth);
    }

    density /= data.length;
    kdePoints.push({ x, density });
  }

  if (normalize) {
    // Normalize to fit in display
    const maxDensity = Math.max(...kdePoints.map(p => p.density));
    return kdePoints.map(p => ({ x: p.x, density: p.density / maxDensity }));
  }

  return kdePoints;
};

// Simple icon components
const ChevronLeft = ({ size }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
    <polyline points="15 18 9 12 15 6"></polyline>
  </svg>
);

const ChevronRight = ({ size }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
    <polyline points="9 18 15 12 9 6"></polyline>
  </svg>
);

const RotateCcw = ({ size }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
    <polyline points="1 4 1 10 7 10"></polyline>
    <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
  </svg>
);

const COMETVisualization = () => {
  const [step, setStep] = useState(0);
  const [vaf, setVaf] = useState(30); // Changed from clonality to vaf
  
  const meanMethylation = 0.3;
  
  // Hardy-Weinberg proportions
  const p = meanMethylation;
  const hwePropMM = p * p;
  const hwePropMU = 2 * p * (1 - p);
  const hwePropUU = (1 - p) * (1 - p);
  
  // Generate example CpGs
  const generateCpGs = (vafPercent) => {
    const vafFraction = vafPercent / 100;
    // Convert VAF to clonality: for heterozygous mutations, clonality = 2 * VAF
    const clonality = vafFraction * 2;
    const cpgs = [];

    // Simulate 100 CpGs
    for (let i = 0; i < 100; i++) {
      const random = Math.random();
      let originalState, targetValue;

      // Assign states based on HWE
      if (random < hwePropUU) {
        originalState = 'UU';
        targetValue = 0;
      } else if (random < hwePropUU + hwePropMU) {
        originalState = 'MU';
        targetValue = 0.5;
      } else {
        originalState = 'MM';
        targetValue = 1.0;
      }

      // Add noise
      const noise = (Math.random() - 0.5) * 0.1;
      // Use clonality (not VAF) to calculate the shift toward target state
      const observedValue = p + (targetValue - p) * clonality + noise;
      const clampedValue = Math.max(0, Math.min(1, observedValue));

      cpgs.push({
        id: i,
        state: originalState,
        value: clampedValue,
        target: targetValue
      });
    }

    return cpgs;
  };
  
  const cpgs = generateCpGs(vaf);
  const trueVAF = vaf; // True VAF is the slider value

  // Calculate expected counts
  const totalCpGs = cpgs.length;
  const expectedUU = Math.round(totalCpGs * hwePropUU);
  const expectedMU = Math.round(totalCpGs * hwePropMU);
  const expectedMM = Math.round(totalCpGs * hwePropMM);

  // Calculate KDE for all CpGs
  const kdeAll = useMemo(() => {
    const values = cpgs.map(c => c.value);
    return calculateKDE(values, 0.05, 100);
  }, [cpgs]);

  // Assign CpGs to states based on expected proportions
  // Sort CpGs by deviation from mean (ascending: most negative to most positive)
  const sortedCpGs = [...cpgs].sort((a, b) => (a.value - meanMethylation) - (b.value - meanMethylation));

  const assignedCpGs = sortedCpGs.map((cpg, index) => {
    // Assign based on rank order and expected proportions
    // Bottom expectedUU CpGs (most below mean) → UU
    // Middle expectedMU CpGs (near mean) → MU
    // Top expectedMM CpGs (most above mean) → MM
    let assignment;
    if (index < expectedUU) {
      assignment = 'UU';
    } else if (index < expectedUU + expectedMU) {
      assignment = 'MU';
    } else {
      assignment = 'MM';
    }
    return { ...cpg, assigned: assignment };
  });
  
  // Calculate VAF
  const calculateVAF = () => {
    let vafSum = 0;
    let count = 0;
    
    assignedCpGs.forEach(cpg => {
      if (cpg.assigned === 'MM') {
        const vaf = (cpg.value - p) / (2 * hwePropUU + hwePropMU);
        vafSum += vaf;
        count++;
      } else if (cpg.assigned === 'UU') {
        const vaf = (p - cpg.value) / (2 * hwePropMM + hwePropMU);
        vafSum += vaf;
        count++;
      }
    });
    
    const avgVAF = count > 0 ? vafSum / count : 0;
    return avgVAF;
  };
  
  const rawScore = calculateVAF();
  // Convert raw score to percentage for comparison
  const rawScorePercent = rawScore * 100;
  const relativeError = trueVAF > 0 ? ((rawScorePercent - trueVAF) / trueVAF) * 100 : 0;
  const absoluteError = Math.abs(rawScorePercent - trueVAF);

  // Calculate KDE for each assigned state
  const kdeByState = useMemo(() => {
    const uu = assignedCpGs.filter(c => c.assigned === 'UU').map(c => c.value);
    const mu = assignedCpGs.filter(c => c.assigned === 'MU').map(c => c.value);
    const mm = assignedCpGs.filter(c => c.assigned === 'MM').map(c => c.value);

    // Calculate raw KDEs without normalization
    const uuKDE = uu.length > 0 ? calculateKDE(uu, 0.05, 100, false) : [];
    const muKDE = mu.length > 0 ? calculateKDE(mu, 0.05, 100, false) : [];
    const mmKDE = mm.length > 0 ? calculateKDE(mm, 0.05, 100, false) : [];

    // Find global max density across all states for consistent scaling
    const allDensities = [
      ...uuKDE.map(p => p.density),
      ...muKDE.map(p => p.density),
      ...mmKDE.map(p => p.density)
    ];
    const globalMax = Math.max(...allDensities, 1e-10);

    // Scale by number of assignments to make cumulative height proportional
    return {
      uu: uuKDE.map(p => ({ x: p.x, density: p.density / globalMax, count: uu.length })),
      mu: muKDE.map(p => ({ x: p.x, density: p.density / globalMax, count: mu.length })),
      mm: mmKDE.map(p => ({ x: p.x, density: p.density / globalMax, count: mm.length }))
    };
  }, [assignedCpGs]);

  const steps = [
    {
      title: "Step 1: Group CpGs by Similar Mean Methylation",
      description: ""
    },
    {
      title: "Step 2: Calculate Expected State Equilibrium Proportions",
      description: ""
    },
    {
      title: "Step 3: Assign Each CpG to an Allelic State",
      description: ""
    },
    {
      title: "Step 4: Determine Clone State at Each CpG",
      description: ""
    },
    {
      title: "Step 5: Calculate Clonality Score",
      description: ""
    }
  ];

  return (
    <div className="w-full max-w-6xl mx-auto p-6 bg-gradient-to-br from-blue-50 to-indigo-50 rounded-lg shadow-lg">
      <div className="mb-6">
        <h1 className="text-3xl font-bold text-gray-800 mb-2">COMET Algorithm Visualization</h1>
        <p className="text-gray-600">Interactive demonstration of Clonal Observation from METhylation</p>
      </div>
      
    {/* VAF Slider */}
      <div className="bg-white p-4 rounded-lg shadow mb-6">
        <label className="block text-sm font-semibold text-gray-700 mb-2">
          Simulated VAF: {vaf}%
        </label>
        <input
          type="range"
          min="0"
          max="50"
          value={vaf}
          onChange={(e) => setVaf(Number(e.target.value))}
          className="w-full h-2 bg-blue-200 rounded-lg appearance-none cursor-pointer"
        />
        <div className="flex justify-between text-xs text-gray-500 mt-1">
          <span>0% VAF</span>
          <span>25% VAF</span>
          <span>50% VAF</span>
        </div>
      </div>

      {/* Step Navigation */}
      <div className="bg-white p-4 rounded-lg shadow mb-6">
        <div className="flex items-center justify-between mb-4">
          <button
            onClick={() => setStep(Math.max(0, step - 1))}
            disabled={step === 0}
            className="flex items-center gap-2 px-4 py-2 bg-blue-500 text-white rounded disabled:bg-gray-300 disabled:cursor-not-allowed"
          >
            <ChevronLeft size={20} /> Previous
          </button>
          
          <div className="text-center">
            <h2 className="text-xl font-bold text-gray-800">{steps[step].title}</h2>
            <p className="text-sm text-gray-600 mt-1">{steps[step].description}</p>
          </div>
          
          <button
            onClick={() => setStep(Math.min(steps.length - 1, step + 1))}
            disabled={step === steps.length - 1}
            className="flex items-center gap-2 px-4 py-2 bg-blue-500 text-white rounded disabled:bg-gray-300 disabled:cursor-not-allowed"
          >
            Next <ChevronRight size={20} />
          </button>
        </div>
        
        {/* Progress Bar */}
        <div className="w-full bg-gray-200 rounded-full h-2">
          <div
            className="bg-blue-500 h-2 rounded-full transition-all duration-300"
            style={{ width: `${((step) / (steps.length -1)) * 100}%` }}
          />
        </div>
      </div>
      

      {/* Main Visualization */}
      <div className="bg-white p-6 rounded-lg shadow mb-6">
        {step === 0 && (
          <div>
            <h3 className="text-lg font-semibold mb-4">Group CpGs by Similar Mean Methylation</h3>
            <div className="relative h-64 border-2 border-gray-300 rounded mb-4">
              <svg width="100%" height="100%" viewBox="0 0 600 250">
                {/* Axes */}
                <line x1="50" y1="200" x2="550" y2="200" stroke="#333" strokeWidth="2" />
                <line x1="50" y1="200" x2="50" y2="20" stroke="#333" strokeWidth="2" />

                {/* X-axis labels */}
                <text x="50" y="220" fontSize="12" textAnchor="middle">0.0</text>
                <text x="300" y="220" fontSize="12" textAnchor="middle">0.5</text>
                <text x="550" y="220" fontSize="12" textAnchor="middle">1.0</text>
                <text x="300" y="240" fontSize="14" textAnchor="middle" fontWeight="bold">Methylation Value</text>

                {/* Mean line */}
                <line
                  x1={50 + p * 500}
                  y1="20"
                  x2={50 + p * 500}
                  y2="200"
                  stroke="#f59e0b"
                  strokeWidth="2"
                  strokeDasharray="5,5"
                />
                <text x={50 + p * 500} y="15" fontSize="12" fill="#f59e0b" textAnchor="middle">
                  Mean={p}
                </text>

                {/* KDE curve */}
                <path
                  d={kdeAll.map((point, i) => {
                    const x = 50 + point.x * 500;
                    const y = 200 - point.density * 150;
                    return `${i === 0 ? 'M' : 'L'} ${x} ${y}`;
                  }).join(' ')}
                  fill="none"
                  stroke="#3b82f6"
                  strokeWidth="3"
                  opacity="0.8"
                />

                {/* Plot CpGs */}
                {cpgs.map((cpg, i) => (
                  <circle
                    key={cpg.id}
                    cx={50 + cpg.value * 500}
                    cy={190 - (i % 8) * 20}
                    r="4"
                    fill="#3b82f6"
                    opacity="0.7"
                  />
                ))}
              </svg>
            </div>
            <div className="bg-blue-50 p-4 rounded">
              <p className="text-sm text-gray-700">
                <strong>The algorithm selects CpGs with similar mean methylation values</strong> (e.g., all CpGs with mean between 0.25-0.30).
                This ensures:
              </p>
              <ul className="text-sm text-gray-700 mt-2 space-y-1 list-disc list-inside">
                <li>Expected state equilibrium proportions can be reliably calculated for the group</li>
                <li>The group contains enough CpGs to detect clonal signals</li>
              </ul>
              <p className="text-sm text-gray-700 mt-3">
                Here we have {totalCpGs} CpGs with mean methylation ~{p}. Based on equilibrium proportions:
              </p>
              <ul className="text-sm text-gray-700 mt-2 space-y-1 list-disc list-inside">
                <li>Expected # of MM CpGs = {totalCpGs} × {hwePropMM.toFixed(3)} ≈ {expectedMM}</li>
                <li>Expected # of MU CpGs = {totalCpGs} × {hwePropMU.toFixed(3)} ≈ {expectedMU}</li>
                <li>Expected # of UU CpGs = {totalCpGs} × {hwePropUU.toFixed(3)} ≈ {expectedUU}</li>
              </ul>
            </div>
          </div>
        )}

        {step === 1 && (
          <div>
            <h3 className="text-lg font-semibold mb-4">Expected State Equilibrium Proportions</h3>
            <div className="grid grid-cols-3 gap-4 mb-4">
              <div className="bg-purple-100 p-4 rounded text-center">
                <div className="text-3xl font-bold text-purple-700">{(hwePropUU * 100).toFixed(1)}%</div>
                <div className="text-sm text-gray-600 mt-2">P(UU)</div>
                <div className="text-xs text-gray-500 mt-1">= (1-p)² = (1-0.3)²</div>
                <div className="text-xs text-gray-500">= {hwePropUU.toFixed(3)}</div>
                <div className="text-xs text-gray-600 mt-2 italic">Both alleles unmethylated</div>
              </div>
              <div className="bg-green-100 p-4 rounded text-center">
                <div className="text-3xl font-bold text-green-700">{(hwePropMU * 100).toFixed(1)}%</div>
                <div className="text-sm text-gray-600 mt-2">P(MU)</div>
                <div className="text-xs text-gray-500 mt-1">= 2p(1-p) = 2(0.3)(0.7)</div>
                <div className="text-xs text-gray-500">= {hwePropMU.toFixed(3)}</div>
                <div className="text-xs text-gray-600 mt-2 italic">One allele methylated</div>
              </div>
              <div className="bg-red-100 p-4 rounded text-center">
                <div className="text-3xl font-bold text-red-700">{(hwePropMM * 100).toFixed(1)}%</div>
                <div className="text-sm text-gray-600 mt-2">P(MM)</div>
                <div className="text-xs text-gray-500 mt-1">= p² = (0.3)²</div>
                <div className="text-xs text-gray-500">= {hwePropMM.toFixed(3)}</div>
                <div className="text-xs text-gray-600 mt-2 italic">Both alleles methylated</div>
              </div>
            </div>
            <div className="bg-blue-50 p-4 rounded">
              <p className="text-sm text-gray-700 mb-2">
                <strong>For a CpG with mean methylation p = {p}:</strong>
              </p>
              <ul className="text-sm text-gray-700 space-y-1 list-disc list-inside">
                <li>P(MM) = {hwePropMM.toFixed(3)} ({(hwePropMM * 100).toFixed(1)}% probability both alleles methylated)</li>
                <li>P(MU) = {hwePropMU.toFixed(3)} ({(hwePropMU * 100).toFixed(1)}% probability one allele methylated)</li>
                <li>P(UU) = {hwePropUU.toFixed(3)} ({(hwePropUU * 100).toFixed(1)}% probability both alleles unmethylated)</li>
              </ul>
              <p className="text-sm text-gray-700 mt-3">
                These proportions represent the expected distribution of allelic states in the population and,
                by extension, the likelihood that a clone has each state.
              </p>
            </div>
          </div>
        )}


        {step === 2 && (
          <div>
            <h3 className="text-lg font-semibold mb-4">Assign Each CpG to an Allelic State</h3>
            <div className="relative h-64 border-2 border-gray-300 rounded mb-4">
              <svg width="100%" height="100%" viewBox="0 0 600 250">
                {/* Axes */}
                <line x1="50" y1="200" x2="550" y2="200" stroke="#333" strokeWidth="2" />

                {/* Target peaks */}
                <line x1="50" y1="200" x2="50" y2="100" stroke="#9333ea" strokeWidth="3" opacity="0.5" />
                <text x="50" y="90" fontSize="12" fill="#9333ea" textAnchor="middle" fontWeight="bold">UU (0%)</text>

                <line x1="300" y1="200" x2="300" y2="100" stroke="#22c55e" strokeWidth="3" opacity="0.5" />
                <text x="300" y="90" fontSize="12" fill="#22c55e" textAnchor="middle" fontWeight="bold">MU (50%)</text>

                <line x1="550" y1="200" x2="550" y2="100" stroke="#ef4444" strokeWidth="3" opacity="0.5" />
                <text x="550" y="90" fontSize="12" fill="#ef4444" textAnchor="middle" fontWeight="bold">MM (100%)</text>

                {/* X-axis labels */}
                <text x="50" y="220" fontSize="12" textAnchor="middle">0.0</text>
                <text x="300" y="220" fontSize="12" textAnchor="middle">0.5</text>
                <text x="550" y="220" fontSize="12" textAnchor="middle">1.0</text>

                {/* KDE curves for each state */}
                {kdeByState.uu.length > 0 && (
                  <path
                    d={kdeByState.uu.map((point, i) => {
                      const x = 50 + point.x * 500;
                      const scale = point.count;
                      const y = 200 - point.density * scale * 0.8;
                      return `${i === 0 ? 'M' : 'L'} ${x} ${y}`;
                    }).join(' ')}
                    fill="none"
                    stroke="#9333ea"
                    strokeWidth="2.5"
                    opacity="0.7"
                  />
                )}
                {kdeByState.mu.length > 0 && (
                  <path
                    d={kdeByState.mu.map((point, i) => {
                      const x = 50 + point.x * 500;
                      const scale = point.count;
                      const y = 200 - point.density * scale * 0.8;
                      return `${i === 0 ? 'M' : 'L'} ${x} ${y}`;
                    }).join(' ')}
                    fill="none"
                    stroke="#22c55e"
                    strokeWidth="2.5"
                    opacity="0.7"
                  />
                )}
                {kdeByState.mm.length > 0 && (
                  <path
                    d={kdeByState.mm.map((point, i) => {
                      const x = 50 + point.x * 500;
                      const scale = point.count;
                      const y = 200 - point.density * scale * 0.8;
                      return `${i === 0 ? 'M' : 'L'} ${x} ${y}`;
                    }).join(' ')}
                    fill="none"
                    stroke="#ef4444"
                    strokeWidth="2.5"
                    opacity="0.7"
                  />
                )}

                {/* Plot assigned CpGs */}
                {assignedCpGs.map((cpg, i) => {
                  const color = cpg.assigned === 'UU' ? '#9333ea' :
                               cpg.assigned === 'MU' ? '#22c55e' : '#ef4444';
                  return (
                    <circle
                      key={cpg.id}
                      cx={50 + cpg.value * 500}
                      cy={190 - (i % 8) * 20}
                      r="4"
                      fill={color}
                      opacity="0.8"
                    />
                  );
                })}
              </svg>
            </div>
            <div className="bg-blue-50 p-4 rounded mb-3">
              <p className="text-sm text-gray-700 mb-2">
                <strong>Assignment Process:</strong>
              </p>
              <ol className="text-sm text-gray-700 space-y-2 list-decimal list-inside">
                <li>Calculate how many CpGs should be in each state based on equilibrium proportions:
                  <ul className="ml-6 mt-1 space-y-1 list-disc list-inside">
                    <li>Expected # of MM CpGs = {totalCpGs} × {hwePropMM.toFixed(3)} ≈ {expectedMM}</li>
                    <li>Expected # of MU CpGs = {totalCpGs} × {hwePropMU.toFixed(3)} ≈ {expectedMU}</li>
                    <li>Expected # of UU CpGs = {totalCpGs} × {hwePropUU.toFixed(3)} ≈ {expectedUU}</li>
                  </ul>
                </li>
                <li className="mt-2">Sort CpGs by observed methylation value (low to high)</li>
                <li>Assign states based on rank:
                  <ul className="ml-6 mt-1 space-y-1 list-disc list-inside">
                    <li>Bottom {expectedUU} CpGs (lowest values) → UU</li>
                    <li>Middle {expectedMU} CpGs → MU</li>
                    <li>Top {expectedMM} CpGs (highest values) → MM</li>
                  </ul>
                </li>
              </ol>
            </div>
            <div className="flex gap-4 text-sm mb-2">
              <div className="flex items-center gap-2">
                <div className="w-4 h-4 bg-purple-600 rounded"></div>
                <span>{assignedCpGs.filter(c => c.assigned === 'UU').length} CpGs assigned UU (lowest values)</span>
              </div>
              <div className="flex items-center gap-2">
                <div className="w-4 h-4 bg-green-600 rounded"></div>
                <span>{assignedCpGs.filter(c => c.assigned === 'MU').length} CpGs assigned MU (middle values)</span>
              </div>
              <div className="flex items-center gap-2">
                <div className="w-4 h-4 bg-red-600 rounded"></div>
                <span>{assignedCpGs.filter(c => c.assigned === 'MM').length} CpGs assigned MM (highest values)</span>
              </div>
            </div>
          </div>
        )}

        {step === 3 && (
          <div>
            <h3 className="text-lg font-semibold mb-4">Determine Clone State at Each CpG</h3>
            <div className="bg-blue-50 p-4 rounded mb-4">
              <p className="text-sm text-gray-700 mb-2">
                <strong>The assignment reveals which state the clone has at each CpG:</strong>
              </p>
              <ul className="text-sm text-gray-700 space-y-2 list-disc list-inside">
                <li><strong className="text-purple-700">CpGs assigned to UU:</strong> The clone likely has both alleles unmethylated at this site (shifting toward 0%)</li>
                <li><strong className="text-green-700">CpGs assigned to MU:</strong> The clone likely has one methylated, one unmethylated allele (shifting toward 50%)</li>
                <li><strong className="text-red-700">CpGs assigned to MM:</strong> The clone likely has both alleles methylated at this site (shifting toward 100%)</li>
              </ul>
            </div>

            <div className="relative h-64 border-2 border-gray-300 rounded mb-4">
              <svg width="100%" height="100%" viewBox="0 0 600 250">
                {/* Axes */}
                <line x1="50" y1="200" x2="550" y2="200" stroke="#333" strokeWidth="2" />

                {/* Mean line */}
                <line
                  x1={50 + p * 500}
                  y1="20"
                  x2={50 + p * 500}
                  y2="200"
                  stroke="#f59e0b"
                  strokeWidth="3"
                  strokeDasharray="5,5"
                />
                <text x={50 + p * 500} y="15" fontSize="12" fill="#f59e0b" textAnchor="middle" fontWeight="bold">
                  Mean p={p}
                </text>

                {/* Target lines */}
                <line x1="50" y1="20" x2="50" y2="200" stroke="#9333ea" strokeWidth="2" strokeDasharray="3,3" opacity="0.5" />
                <text x="50" y="235" fontSize="10" fill="#9333ea" textAnchor="middle">0% (UU target)</text>

                <line x1="300" y1="20" x2="300" y2="200" stroke="#22c55e" strokeWidth="2" strokeDasharray="3,3" opacity="0.5" />
                <text x="300" y="235" fontSize="10" fill="#22c55e" textAnchor="middle">50% (MU target)</text>

                <line x1="550" y1="20" x2="550" y2="200" stroke="#ef4444" strokeWidth="2" strokeDasharray="3,3" opacity="0.5" />
                <text x="550" y="235" fontSize="10" fill="#ef4444" textAnchor="middle">100% (MM target)</text>

                {/* Show sample shifts with arrows - random selection */}
                {assignedCpGs
                  .map((cpg, idx) => ({ cpg, idx, random: Math.random() }))
                  .sort((a, b) => a.random - b.random)
                  .slice(0, 8)
                  .map(({ cpg }, i) => {
                  const color = cpg.assigned === 'UU' ? '#9333ea' :
                               cpg.assigned === 'MU' ? '#22c55e' : '#ef4444';
                  const targetX = cpg.assigned === 'UU' ? 50 :
                                 cpg.assigned === 'MU' ? 300 : 550;
                  const y = 40 + i * 20;

                  return (
                    <g key={cpg.id}>
                      {/* Arrow from mean to current value */}
                      <line
                        x1={50 + p * 500}
                        y1={y}
                        x2={50 + cpg.value * 500}
                        y2={y}
                        stroke={color}
                        strokeWidth="1.5"
                        opacity="0.6"
                        markerEnd="url(#arrowhead)"
                      />
                      {/* Current position */}
                      <circle
                        cx={50 + cpg.value * 500}
                        cy={y}
                        r="3"
                        fill={color}
                      />
                      {/* Dotted line to target */}
                      <line
                        x1={50 + cpg.value * 500}
                        y1={y}
                        x2={targetX}
                        y2={y}
                        stroke={color}
                        strokeWidth="1"
                        strokeDasharray="2,2"
                        opacity="0.3"
                      />
                    </g>
                  );
                })}

                {/* Arrow marker definition */}
                <defs>
                  <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
                    <polygon points="0 0, 10 3, 0 6" fill="currentColor" />
                  </marker>
                </defs>
              </svg>
            </div>

            <p className="text-xs text-gray-600">
              This assignment is based on which direction the methylation has shifted. As clonality increases,
              CpGs shift further from the population mean (p={p}) toward their assigned clonal state.
            </p>
          </div>
        )}

        {step === 4 && (
          <div>
            <h3 className="text-lg font-semibold mb-4">Calculate Clonality Score</h3>

            <div className="bg-blue-50 p-4 rounded mb-4">
              <p className="text-sm text-gray-700 mb-2">
                <strong>Once CpGs are assigned, the algorithm measures how far each CpG has shifted from its expected mean value (p) toward its assigned clonal state:</strong>
              </p>
              <div className="space-y-3 mt-3">
                <div className="bg-white p-3 rounded">
                  <div className="text-sm font-semibold text-red-700 mb-1">For MM clones:</div>
                  <div className="font-mono text-sm">VAF<sub>MM</sub> = (x - p) / (2P<sub>UU</sub> + P<sub>MU</sub>)</div>
                  <div className="text-xs text-gray-600 mt-1">where x = observed methylation at the CpG</div>
                </div>

                <div className="bg-white p-3 rounded">
                  <div className="text-sm font-semibold text-purple-700 mb-1">For UU clones:</div>
                  <div className="font-mono text-sm">VAF<sub>UU</sub> = (p - x) / (2P<sub>MM</sub> + P<sub>MU</sub>)</div>
                  <div className="text-xs text-gray-600 mt-1">where x = observed methylation at the CpG</div>
                </div>

                <div className="bg-white p-3 rounded">
                  <div className="text-sm font-semibold text-gray-700 mb-1">Where:</div>
                  <ul className="text-xs text-gray-700 space-y-1 list-disc list-inside ml-2">
                    <li><strong>x</strong> = observed methylation proportion at the CpG</li>
                    <li><strong>p</strong> = population mean methylation = {p}</li>
                    <li>The <strong>denominator</strong> accounts for the population structure being replaced</li>
                  </ul>
                </div>
              </div>
            </div>

            <div className="grid grid-cols-2 gap-4 mb-4">
              <div className="bg-green-50 p-4 rounded">
                <div className="text-sm text-gray-600 mb-1">Raw COMET Score</div>
                <div className="text-3xl font-bold text-green-700">{rawScorePercent.toFixed(1)}%</div>
                <div className="text-sm text-gray-500 mt-1">({rawScore.toFixed(3)})</div>
                <div className="text-xs text-gray-600 mt-2">Mean VAF across all UU and MM CpGs</div>
              </div>
              <div className="bg-orange-50 p-4 rounded">
                <div className="text-sm text-gray-600 mb-1">True VAF</div>
                <div className="text-3xl font-bold text-orange-700">{trueVAF.toFixed(1)}%</div>
                <div className="text-sm text-gray-500 mt-1">(from slider)</div>
                <div className="text-xs text-gray-600 mt-2">Simulated ground truth</div>
              </div>
            </div>

            <div className="bg-rose-50 p-4 rounded">
              <h4 className="font-semibold text-gray-700 mb-2">Error Metrics:</h4>
              <div className="grid grid-cols-2 gap-4">
                <div>
                  <div className="text-sm text-gray-600">Relative Error</div>
                  <div className="text-2xl font-bold text-rose-700">
                    {relativeError.toFixed(1)}%
                  </div>
                </div>
                <div>
                  <div className="text-sm text-gray-600">Absolute Error</div>
                  <div className="text-2xl font-bold text-rose-700">
                    {absoluteError.toFixed(1)} pp
                  </div>
                </div>
              </div>
              <div className="text-xs text-gray-600 mt-2">
                Note: MU-assigned CpGs are ignored as they provide the weakest signal. Raw scores can be calibrated using regression models.
              </div>
            </div>

          </div>
        )}
      </div>

      {/* Reset Button */}
      <div className="text-center">
        <button
          onClick={() => { setStep(0); setVaf(30); }}
          className="flex items-center gap-2 mx-auto px-6 py-2 bg-gray-500 text-white rounded hover:bg-gray-600"
        >
          <RotateCcw size={18} /> Reset Demo
        </button>
      </div>
    </div>
  );
};

// Render the app
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<COMETVisualization />);
    </script>
</body>
</html>
